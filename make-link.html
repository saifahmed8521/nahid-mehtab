<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Invite Link Maker</title>
  <link rel="icon" href="assets/img/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    :root { --wine: #260a0f; --wine2: #3a1018; --gold: #c8a76c; --gold2: #ead7a8; --ivory: #f3e9d7; --muted: #a8977d; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 32px 16px 60px;
      font-family: 'Cormorant Garamond', Georgia, serif; font-size: 19px; color: var(--ivory);
      background: radial-gradient(90% 60% at 50% 0%, #4b1621, transparent 70%), var(--wine);
    }
    main { max-width: 560px; margin: 0 auto; }
    h1 { font-family: 'Great Vibes', cursive; font-weight: 400; font-size: 54px; text-align: center; margin: 0; color: var(--gold2); }
    .sub { text-align: center; color: var(--muted); font-style: italic; margin: 0 0 28px; }
    .card { border: 1px solid rgba(200, 167, 108, .35); border-radius: 16px; padding: 22px; background: rgba(58, 16, 24, .6); }
    label { display: block; font-family: Cinzel, serif; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); margin: 18px 0 8px; }
    label:first-child { margin-top: 0; }
    input[type=text], textarea {
      width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(200, 167, 108, .4);
      background: rgba(26, 5, 8, .7); color: var(--ivory); font: inherit; font-size: 18px;
    }
    textarea { min-height: 120px; resize: vertical; }
    input:focus, textarea:focus { outline: 2px solid var(--gold2); outline-offset: 1px; }
    .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .seg input { position: absolute; opacity: 0; pointer-events: none; }
    .seg span {
      display: block; text-align: center; padding: 12px 8px; border-radius: 10px; cursor: pointer;
      border: 1px solid rgba(200, 167, 108, .4); font-family: Cinzel, serif; font-size: 13px; letter-spacing: .08em;
    }
    .seg input:checked + span { background: linear-gradient(120deg, #b8965a, #ead7a8 50%, #c8a76c); color: var(--wine); border-color: transparent; }
    .seg input:focus-visible + span { outline: 2px solid var(--gold2); outline-offset: 2px; }
    .out { word-break: break-all; padding: 12px 14px; border-radius: 10px; background: rgba(26, 5, 8, .7); border: 1px dashed rgba(200, 167, 108, .45); font-family: ui-monospace, Menlo, monospace; font-size: 14px; color: var(--gold2); }
    .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    button, .btn {
      flex: 1 1 160px; display: inline-flex; justify-content: center; align-items: center; min-height: 46px; padding: 10px 16px;
      border-radius: 999px; border: 1px solid rgba(200, 167, 108, .55); background: rgba(219, 192, 137, .08);
      color: var(--gold2); font-family: Cinzel, serif; font-size: 12.5px; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; text-decoration: none;
    }
    .primary { background: linear-gradient(120deg, #b8965a, #ead7a8 50%, #c8a76c); color: var(--wine); border-color: transparent; }
    .note { color: var(--muted); font-size: 16px; font-style: italic; margin-top: 10px; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--gold2); color: var(--wine); padding: 8px 18px; border-radius: 999px; font-family: Cinzel, serif; font-size: 12px; opacity: 0; transition: opacity .3s; }
    .toast.on { opacity: 1; }
  </style>
</head>
<body>
<main>
  <h1>Invite Link Maker</h1>
  <p class="sub">Make a personal invitation link for each guest. This page is just for the family.</p>

  <div class="card">
    <label for="name">Guest name (shown on the opening door)</label>
    <input id="name" type="text" placeholder="e.g. Khan Family" autocomplete="off">

    <label>Which invitation?</label>
    <div class="seg" role="radiogroup">
      <label style="margin:0"><input type="radio" name="v" value="nikah" checked><span>Nikah only</span></label>
      <label style="margin:0"><input type="radio" name="v" value="haldi"><span>Haldi + Nikah</span></label>
    </div>

    <label>Link</label>
    <div class="out" id="out"></div>

    <label for="msg">WhatsApp message</label>
    <textarea id="msg"></textarea>

    <div class="row">
      <button type="button" id="copy">Copy link</button>
      <a class="btn primary" id="wa" href="#" target="_blank" rel="noopener">Send on WhatsApp</a>
    </div>
    <p class="note">Tip: leave the name empty for a general link you can post in groups.</p>
  </div>
</main>
<div class="toast" id="toast">Copied</div>
<script>
(() => {
  const base = location.href.replace(/make-link\.html.*$/, '').replace(/[?#].*$/, '');
  const $ = (id) => document.getElementById(id);
  let edited = false;
  function link() {
    const p = new URLSearchParams();
    const n = $('name').value.trim();
    if (document.querySelector('input[name=v]:checked').value === 'haldi') p.set('haldi', '');
    if (n) p.set('to', n);
    const q = p.toString().replace('haldi=', 'haldi');
    return base + (q ? '?' + q : '');
  }
  function defaultMsg(url) {
    const n = $('name').value.trim();
    const haldi = document.querySelector('input[name=v]:checked').value === 'haldi';
    return `Assalamu Alaikum${n ? ' ' + n : ''}!\n\nWith the blessings of Allah (SWT), we warmly invite you to ${haldi ? 'the Haldi and ' : ''}the Nikah of Nahid & Mehtab on Saturday, 2nd January 2027.\n\nPlease open your invitation:\n${url}\n\n— Ahmed Family`;
  }
  function update() {
    const url = link();
    $('out').textContent = url;
    if (!edited) $('msg').value = defaultMsg(url);
    else $('msg').value = $('msg').value.replace(/https?:\/\/\S+/, url);
    $('wa').href = 'https://wa.me/?text=' + encodeURIComponent($('msg').value);
  }
  $('name').addEventListener('input', update);
  document.querySelectorAll('input[name=v]').forEach((r) => r.addEventListener('change', update));
  $('msg').addEventListener('input', () => { edited = true; $('wa').href = 'https://wa.me/?text=' + encodeURIComponent($('msg').value); });
  $('copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(link()); } catch (e) { prompt('Copy this link:', link()); return; }
    $('toast').classList.add('on'); setTimeout(() => $('toast').classList.remove('on'), 1600);
  });
  update();
})();
</script>
</body>
</html>
